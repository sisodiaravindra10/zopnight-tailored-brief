server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  gzip on;
  gzip_min_length 1024;
  gzip_types text/html text/css application/javascript image/svg+xml;
  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
  # Screenshots are content-addressed by filename; cache them hard.
  location /img/ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; try_files $uri =404; }
  # Every other path serves the deck; role, depth and step travel in the query string and hash.
  location / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
}
